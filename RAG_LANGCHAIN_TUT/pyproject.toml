[project]
name = "rag-langchain-tut"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lena shajahan", email = "lenashajahan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.3",
    "pymupdf>=2.1",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag-langchain-tut = "rag_langchain_tut:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
